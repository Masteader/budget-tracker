# gitleaks configuration for CI (.github/workflows/ci.yml, job "secrets").
# Extends the built-in ruleset; only add allowlist entries for verified false positives.
# Never allowlist a real credential: rotate it and remove it from the tree instead.

title = "budget-tracker"

[extend]
useDefault = true

[allowlist]
description = "Verified false positives"
# flutter_app/lib/screens/settings/help_support_screen.dart passes localisation key
# names such as questionKey: 'faq_receipts_q1'. The generic-api-key rule reads the
# `...Key:` label plus the identifier as a credential. These are l10n identifiers.
regexTarget = "secret"
regexes = [
  '''^faq_[a-z]+_[qa][0-9]+$''',
]
