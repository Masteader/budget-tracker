name: budget_tracker
description: Household budget tracker with AI-powered Saudi bank SMS parsing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Supabase ────────────────────────────────────────────────────────────────
  supabase_flutter: ^2.5.2

  # ── SMS Listening ────────────────────────────────────────────────────────────
  telephony: ^0.2.0

  # ── HTTP ─────────────────────────────────────────────────────────────────────
  http: ^1.2.1

  # ── Local storage (offline SMS queue) ────────────────────────────────────────
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # ── State management ─────────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Charts ───────────────────────────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ── Notifications ────────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2

  # ── Utilities ────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  crypto: ^3.0.3          # HMAC signing for webhook requests
  uuid: ^4.4.0
  timeago: ^3.6.1         # "2 minutes ago" labels
  shimmer: ^3.0.0         # Loading skeleton screens
  google_fonts: ^6.2.1    # Typography

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
