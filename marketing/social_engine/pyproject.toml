# The engine is not an installable package: pytest finds it through `pythonpath`,
# so parallel worktrees can share one venv. Install with:
#   pip install --only-binary=:all: --group runtime --group dev
[project]
name = "social-engine"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
runtime = [
    "python-telegram-bot==22.8",
    "pydantic==2.14.2",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.4",
    "tzdata==2026.6",
    "anthropic==2.4.0",
    "azure-cognitiveservices-speech==1.53.0",
]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
