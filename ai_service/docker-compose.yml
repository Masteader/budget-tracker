version: "3.9"

services:
  ai_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget_tracker_ai
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # ── Supabase ──────────────────────────────────────────────────────────
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # ── LiteLLM ───────────────────────────────────────────────────────────
      LITELLM_MODEL: ${LITELLM_MODEL:-gemini/gemini-2.0-flash-lite}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      # ── Security ──────────────────────────────────────────────────────────
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      ALLOWED_SENDERS: ${ALLOWED_SENDERS:-SNB,ALRAJHI,9200}
      # ── Server ────────────────────────────────────────────────────────────
      PORT: 8000
      RELOAD: "false"
    env_file:
      - .env   # local overrides; never commit this file
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
